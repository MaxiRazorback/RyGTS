workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [build, package]
variables:
  GIT_SUBMODULE_STRATEGY: none

launcher:
  stage: build
  tags: [saas-windows-medium-amd64]
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File ci/build-windows.ps1 -Target Launcher
  artifacts:
    name: 'launcher-$CI_COMMIT_SHORT_SHA'
    paths: [artifacts/launcher/]
    expire_in: 14 days

renderer:
  stage: build
  tags: [saas-windows-medium-amd64]
  timeout: 3h
  before_script:
    - . ./ci/setup-hosted-windows.ps1
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File ci/build-windows.ps1 -Target Renderer
  artifacts:
    name: 'renderer-$CI_COMMIT_SHORT_SHA'
    paths: [artifacts/renderer/]
    expire_in: 14 days

converter-and-tests:
  stage: build
  image: ubuntu:24.04
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential cmake ninja-build
  script:
    - cmake --preset linux-release-cli
    - cmake --build --preset linux-release-cli --parallel 2
    - ctest --test-dir build/linux-release-cli --output-on-failure --no-tests=error --output-junit "$CI_PROJECT_DIR/converter-tests.xml"
  artifacts:
    when: always
    paths: [build/linux-release-cli/core/relinker/ryty]
    reports:
      junit: converter-tests.xml
    expire_in: 14 days

package:
  stage: package
  image: python:3.12-slim
  needs:
    - job: launcher
      artifacts: true
    - job: renderer
      artifacts: true
    - job: converter-and-tests
      artifacts: false
  script:
    - python ci/package.py
  artifacts:
    name: 'RyGT-development-$CI_COMMIT_SHORT_SHA'
    paths:
      - dist/*.zip
      - dist/*.zip.sha256
    expire_in: 30 days
